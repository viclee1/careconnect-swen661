name: Flutter tests

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-tests.yml'
  pull_request:
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-tests.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: flutter

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage-lcov
          path: flutter/coverage/lcov.info
