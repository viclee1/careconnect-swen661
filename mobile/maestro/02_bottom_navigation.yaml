appId: edu.umgc.swen661.careconnect
name: "Critical flow 2 - bottom navigation reaches every destination"
---
- launchApp:
    clearState: true
- tapOn: "I already have an account"
- assertVisible: "Sign in to your account."
- tapOn: "Sign in"
- assertVisible: "Here's your day, Margaret"
- tapOn: "Go to My Day"
- assertVisible: ".*0 of 7 done.*"
- tapOn: "Go to Appointments"
- assertVisible: ".*Dr. Robert Chen.*"
- tapOn: "Go to Medicines"
- assertVisible: ".*1 of 3 taken.*"
- tapOn: "Go to Memories"
- assertVisible: ".*Family Picnic at Quiet Waters*"
- tapOn: "Go to Contacts"
- assertVisible: "People who care for you"
